<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | StyleHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Style<span>Hub</span></a>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <i class="fa-solid fa-moon" id="theme-toggle"></i>
                <i class="fa-solid fa-cart-shopping"><span class="cart-count" style="font-size:10px; vertical-align: top;">0</span></i>
                <i class="fa-solid fa-bars menu-btn" id="menu-btn"></i>
            </div>
        </div>
    </header>

    <div class="page-header">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you.</p>
    </div>

    <section class="container animate-on-scroll">
        <div class="contact-container">
            <div class="contact-info">
                <h2 style="margin-bottom: 20px;">Contact Information</h2>
                <p><i class="fa-solid fa-location-dot" style="color:var(--color-gold); margin-right:10px;"></i> 123 Fashion Street, Vadodara, Gujarat 390001</p>
                <p style="margin-top:15px;"><i class="fa-solid fa-phone" style="color:var(--color-gold); margin-right:10px;"></i> +91 98765 43210</p>
                <p style="margin-top:15px;"><i class="fa-solid fa-envelope" style="color:var(--color-gold); margin-right:10px;"></i> support@stylehub.com</p>
                
                <h3 style="margin-top: 40px; margin-bottom: 15px;">Locate Us</h3>
                <div style="width: 100%; height: 250px; border-radius: 8px; overflow: hidden;">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d118106.70010221669!2d73.17308625!3d22.32210265!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395fc8ab91a3ddab%3A0xac39d3bfe1473fb8!2sVadodara%2C%20Gujarat%2C%20India!5e0!3m2!1sen!2sus!4v1717431189914!5m2!1sen!2sus" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            
            <div class="contact-form glass-card" style="padding: 30px;">
                <h2 style="margin-bottom: 20px;">Send a Message</h2>
                <form id="contactForm" onsubmit="event.preventDefault(); alert('Message Sent!');">
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <input type="text" placeholder="Subject">
                    <textarea placeholder="Your Message" required></textarea>
                    <button type="submit" class="btn btn-gold" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
